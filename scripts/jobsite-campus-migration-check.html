<!DOCTYPE html><meta charset="utf-8"><title>Campus save upgrade checks</title>
<style>body{background:#191714;color:#ede6dc;font:14px system-ui;margin:20px}iframe{width:1100px;max-width:100%;height:760px;border:1px solid #72624f}li{margin:8px 0}.fail{color:#efb193}</style>
<h1>Campus save upgrade checks</h1><p id="status">Starting</p><ol id="results"></ol><iframe title="Campus save test"></iframe>
<script>
window.campusTestStorage=new Map();
const frame=document.querySelector('iframe'),key='openmud-jobsite-campus-v1:stratos',backup=key+':before-process-update';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,el=id=>doc()?.getElementById(id);
async function until(fn){const deadline=Date.now()+15000;while(Date.now()<deadline){if(fn())return;await sleep(80);}throw Error('Timed out: '+fn);}
function check(name,pass){const li=document.createElement('li');li.textContent=(pass?'PASS: ':'FAIL: ')+name;document.querySelector('#results').append(li);if(!pass)throw Error(name);}
async function load(query){await new Promise(resolve=>{frame.onload=resolve;frame.src='/__campus-fixture?'+query;});await until(()=>doc()?.body?.dataset.campusReady==='true');}
(async()=>{try{
 await load('legacy=true');const original=campusTestStorage.get(key),old=JSON.parse(original);
 el('mobilize-campus').click();await until(()=>JSON.parse(campusTestStorage.get(key)).version===2);
 const upgraded=JSON.parse(campusTestStorage.get(key));
 check('Old save is backed up byte for byte before replacement',campusTestStorage.get(backup)===original);
 check('Upgraded project preserves day and spending and explains legacy credit',upgraded.day===old.day&&upgraded.spent===old.spent&&Object.keys(upgraded.tasks).length===44&&el('process-save-note').textContent.includes('Earlier progress retained'));
 await load('');el('mobilize-campus').click();await until(()=>!el('construction').hidden);
 check('Reload uses the updated save and retains the original backup',el('run-project').textContent==='Run project'&&Number(el('metric-day').textContent)===Math.floor(old.day)&&campusTestStorage.get(backup)===original);
 await load('legacy=true&storage-blocked=true');campusTestStorage.delete(backup);const beforeFailure=campusTestStorage.get(key);
 el('mobilize-campus').click();await until(()=>el('storage-status').textContent.includes('unavailable'));
 check('A failed backup preserves the old save and reports storage failure',campusTestStorage.get(key)===beforeFailure&&!campusTestStorage.has(backup)&&!el('process-save-note').textContent.includes('is backed up'));
 document.querySelector('#status').textContent='PASS: all four save upgrade checks';
}catch(error){document.querySelector('#status').textContent='FAIL: '+error.message;}})();
</script>
